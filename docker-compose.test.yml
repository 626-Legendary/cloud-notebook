services:
  cloud-notebook-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-notebook:test
    container_name: cloud-notebook-test
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.test
    environment:
      NODE_ENV: production
      CLOUD_NOTEBOOK_ENV: test
      APP_VERSION: ${APP_VERSION:-1.1.1119}
      DATABASE_URL: /app/data/cloud-notebook.db
      APP_URL: http://localhost:3001
      BACKUP_DIRECTORY: /app/data/backups
    volumes:
      - cloud-notebook-test-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  cloud-notebook-test-data:
    name: cloud-notebook-test-data
