# Disposable browser test environment. No production volume or .env file is used.
name: cloud-notebook-e2e
services:
  cloud-notebook-v31-e2e:
    build: .
    image: cloud-notebook:v3.1-test
    container_name: cloud-notebook-v31-e2e
    init: true
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: production
      CLOUD_NOTEBOOK_ENV: test
      APP_VERSION: 1.0.1112
      APP_URL: http://127.0.0.1:3002
      DATABASE_URL: /app/data/v31-e2e.db
      JWT_SECRET: v31-isolated-browser-test-secret-at-least-32-characters
      ADMIN_INITIAL_PASSWORD: V31DisposableAdmin12345
      BACKUP_ENABLED: "false"
    tmpfs:
      - /app/data:uid=1000,gid=1000,mode=0770,size=268435456
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
